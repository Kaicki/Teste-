<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyFlix</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="text-white">

<div class="fixed top-0 w-full flex justify-between items-center px-6 py-4 bg-black z-50">
  <h1 class="text-2xl font-bold text-red-600">MyFlix</h1>
  <div class="flex gap-4">
    <button onclick="loadMovies()">Filmes</button>
    <button onclick="loadSeries()">Séries</button>
  </div>
</div>

<!-- BANNER -->
<div id="banner" class="mt-16 h-[60vh] flex items-end p-6 bg-cover bg-center">
  <div>
    <h1 id="bannerTitle" class="text-4xl font-bold"></h1>
    <p id="bannerDesc" class="max-w-xl text-gray-300"></p>
  </div>
</div>

<div id="rows" class="pt-6 px-6"></div>

<script src="script.js"></script>
</body>
</html>
